schema_version: 1
profiles:
- core
record_types:
  debt:
    dir: docs/tech-debt
    numbered: 4
    status_allowed:
    - Open
    - In Progress
    - Repaid
    status_emoji:
      Open: ⚠️
      In Progress: 🚧
      Repaid: ✅
    fields: []
    sections:
    - name: Location
      hint: file / module where the hack lives
      view: ''
    - name: Reason
      hint: why this temporary workaround was introduced
      view: ''
    - name: Trigger for removal
      hint: condition under which this debt must be repaid
      view: ''
    derived: []
  decision:
    dir: docs/decisions
    numbered: 4
    status_allowed:
    - Proposed
    - Accepted
    - Deprecated
    status_emoji:
      Proposed: 🌱
      Accepted: ✅
      Deprecated: 📛
    fields:
    - name: supersedes
      hint: ids of decisions this one replaces
    - name: superseded_by
      hint: ids of decisions that replaced this one
    sections:
    - name: Context
      hint: problem statement & constraints
      view: ''
    - name: Decision
      hint: chosen solution & why over alternatives
      view: ''
    - name: Consequences
      hint: pros
      view: ''
    derived: []
  experiment:
    dir: docs/experiments
    numbered: 4
    status_allowed:
    - Proposed
    - Running
    - Closed
    status_emoji:
      Proposed: 🌱
      Running: 🚧
      Closed: ✅
    fields:
    - name: commit
      hint: git commit hash the experiment runs on
    sections:
    - name: Hypothesis
      hint: the claim being tested (write before running)
      view: ''
    - name: Hyperparameters
      hint: dataset version
      view: ''
    - name: Results
      hint: metric deltas vs baseline
      view: ''
    - name: Conclusion
      hint: hypothesis confirmed / refuted
      view: ''
    derived: []
  incident:
    dir: docs/incidents
    numbered: 4
    status_allowed:
    - Open
    - Closed
    status_emoji:
      Open: 🚨
      Closed: ✅
    fields: []
    sections:
    - name: Summary
      hint: what broke
      view: ''
    - name: Root cause
      hint: ''
      view: ''
    - name: Actions taken
      hint: ''
      view: ''
    - name: Prevention rule
      hint: actionable rule added to guidelines to prevent repeat errors
      view: ''
    derived: []
  plan:
    dir: docs/plans
    numbered: 4
    status_allowed:
    - Draft
    - Active
    - Pending Review
    - Shelved
    - Archived
    status_emoji:
      Draft: ✏️
      Active: 🚧
      Pending Review: 🔍
      Shelved: 📦
      Archived: 🗄️
    fields: []
    sections:
    - name: Goal
      hint: what this plan achieves and why now
      view: ''
    - name: Task List
      hint: rendered from the task table - never hand-edit
      view: tasks
    - name: Notes
      hint: context
      view: ''
    derived: []
  task:
    dir: tasks
    numbered: letter
    status_allowed:
    - Not Started
    - In Progress
    - Done
    status_emoji:
      Not Started: 🕐
      In Progress: 🚧
      Done: ✅
    fields:
    - name: parent
      hint: id of the parent record
    - name: related
      hint: overlapping/related record ids
    sections:
    - name: Steps
      hint: checkbox list
      view: ''
    - name: Open
      hint: open items / decisions needed
      view: ''
    - name: Notes
      hint: results & notes after running
      view: ''
    derived:
    - name: Started
      to_status: In Progress
    - name: Done
      to_status: Done

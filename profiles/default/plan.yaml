record_type: plan
code: PLN
dir: docs/plans
numbered: 4
# 无 contain_task：任务挂接靠 relations 的 parent 边（proj task new --parent），
# 有子任务就在 head 下渲染任务树（任意深度、全展开）；WIP.md 的成员自动
# 推导：plan 进入 wip.enter 状态（Active）即入列，退出即移除，无需注册
# 无 features:（supersede 是纯 relation，所有类型通用）
# K2：plan 不再当 task 的 parent（parent 只 task→task）、不再有 Tasks 块；
# plan 的工作把关改走 Work 清单（item → task 引用，P3 自动同步：task Done →
# item done；引用的 task 未结束时 item 不能手动关闭）
# 清单门禁：进入 Archived 前 Work 与 Success Criteria 两条清单都必须 closed
items:
  - section: Work
    noun: item
    fields: [owner, due]
    wip: true
    gate: [Archived]
  - section: Success Criteria
    noun: criterion
    gate: [Archived]
# 状态机 verbs（from 是具体状态，非 Any）：每个状态都有进入它的动词
wip:
  enter: [Active]
verbs:
  activate: {from: Draft, to: Active}
  resume: {from: Shelved, to: Active}
  review: {from: Active, to: Pending Review}
  shelve: {from: Pending Review, to: Shelved}
  archive: {from: Pending Review, to: Archived}
  freeze: {from: Shelved, to: Archived}
# status 按生命周期顺序排列：Draft → Active → Pending Review → Shelved | Archived
# （Shelved/Archived 是并列的终态；Shelved 可 resume 回 Active 或 freeze 冻结成 Archived）
# done: true 的状态进入即算"已完成"（记录 created/done 的首个日期）
status-allowed:
  - {name: Draft, emoji: ✏️}               # 起草中，暂不登记进 WIP.md
  - {name: Active, emoji: 🚧}              # 执行中，自动登记进 WIP.md（顶层 wip.enter）
  - {name: Pending Review, emoji: 🔍}      # 任务全部 Done，等待评审
  - {name: Shelved, emoji: 📦, done: true} # 评审暂缓，可 resume 回 Active
  - {name: Archived, emoji: 🗄️, done: true} # 已归档，终态
sections:
  - name: Goal
    hint: >-
      First line: `Owner: <the single accountable person> · Target: <date or
      release>`. Then the outcome this plan achieves and why now, in 2-4
      sentences: the problem or opportunity, who benefits, and what is
      different when the plan succeeds. Link the decisions/incidents/
      experiments that motivate it (DEC-xxxx, INC-xxxx, EXP-xxxx). Outcome,
      not activity ("checkout p95 under 1s", not "optimize checkout").
  - name: Scope
    hint: >-
      Two plain bullet lists: `In scope:` (deliverables this plan commits to)
      and `Out of scope:` (related work explicitly not done here, so nobody
      assumes it). Note fixed constraints: deadline, budget, people, systems
      that must not change. Changing scope after activation: write the change
      and the date here and log it with `proj plan update ID -c "..."`.
  - name: Work
    hint: >-
      The deliverables, one per line as an item: `- <what> (→ T-xxxxxx)` —
      reference the task that does it with `proj item add PLN-xxxx "<what>"
      --task T-xxxxxx`; the tool links it and closes the item automatically
      when the task is Done (a task in Failed marks the item failed; move the
      task back to a running status and the item reopens). owner/due: `· owner:
      x · due: YYYY-MM-DD`. This is what a plan's `archive` gates on (all work
      done), and where the WIP.md entry shows the plan's in-progress items.
  - name: Success Criteria
    hint: >-
      Measurable conditions that decide at review time whether the goal was
      met, one per line as an item: "- [ ] error rate < 0.1% for 7 days",
      "- [ ] 3 pilot users onboarded" (the number is added by the tool).
      States: `[ ]` pending, `[x] ✅` met, `[x] ❌` missed. At review,
      evaluate each one with `proj item set PLN-xxxx#n met|missed --note
      <evidence>`; `proj plan archive` is refused while any is still pending.
  - name: Risks & Dependencies
    hint: >-
      What could make the plan late or fail, as bullets: `- Risk: <what> —
      likelihood H/M/L, impact H/M/L — mitigation: <action> — owner`. List
      external dependencies (other teams, vendors, approvals, other plans) with
      the date each is needed by. Revisit when the plan is resumed.
  - name: Review
    hint: >-
      Filled at `proj plan review`: the retrospective and verdict — what went
      well, what did not, what to change next time, and the outcome (archive =
      done, shelve = pause with reason and resume condition); each Success
      Criterion's result (met / missed + evidence) lives in the Success
      Criteria list. Turn lasting lessons into decisions or tasks.

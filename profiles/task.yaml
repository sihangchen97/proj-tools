record_type: task
code: T
dir: docs/tasks
numbered: 6
# 无 contain_task：任务挂接靠 relations 的 parent 边（proj task new --parent），
# 任何记录有子任务就在 head 下渲染任务树（任意深度、全展开）；全局 TASKLIST.md
# 的成员自动推导（无 parent 边且未结束的任务 → Unparented；记录名下有未结束的
# 后代任务 → 该记录一节），无需注册
# 无 features: / 无 fields:（parent/related/supersede 全走 relations 表）
# 无 render: 段（toc 已删，A5/Q6；changelog 表行数走环境变量 PROJ_LOGS）
# task 单独管理（在外层 profiles/，不在 default/）
# 门禁（由 Record.validate_transition 统一实现）：
# gates.tasks — 进入 Done 前，整棵后代任务树必须处于终止状态（Done/Failed）；
# gates.items — 进入 Done 前，Acceptance Criteria 里每条都必须已处理（closed）
gates:
  tasks: [Done]
  items: [Done]
# items: Acceptance Criteria 节的结构化清单（engine/items.py 管理，md 里写
# - [ ] #001 text；编号零填充三位、状态由工具维护）；第一个 closed item 出现时
# Draft 自动升到 In Progress（promote）
items:
  section: Acceptance Criteria
  noun: criterion
  states: [{name: todo}, {name: done, closed: true}]
  fields: [owner, due]
  promote: {from: [Draft], to: In Progress}
verbs:
  start: {from: Any, to: In Progress}
  done:  {from: Any, to: Done}
  fail:  {from: Any, to: Failed}
# status 按时间顺序排列：Draft → In Progress → Done/Failed
# terminal: true = 终止状态（任务结束，不再阻塞父任务门禁）；Failed 也是终止态
status-allowed:
  - {name: Draft, emoji: ✏️}              # 起草中（new 默认）
  - {name: In Progress, emoji: 🚧}        # 执行中
  - {name: Failed, emoji: ❌, terminal: true}  # 失败（无法完成/放弃）：已结束
  - {name: Done, emoji: ✅, done: true}   # 完成（done 同时是终止状态）
sections:
  - name: Goal
    hint: >-
      The outcome this task delivers and why it matters, in 1-3 sentences
      (what changes for the user/system when it is done). Link the driving
      record if any (plan, decision DEC-xxxx, incident INC-xxxx, debt DEB-xxxx).
      If the goal needs more than ~1 day of focused work or several people,
      split it into sub-tasks (proj task new ... --parent T-xxxxxx); this
      task then covers only the integration of its sub-tasks.
  - name: Acceptance Criteria
    hint: >-
      The definition of done as item lines, one per observable result:
      "- [ ] `pixi run test` passes", "- [ ] /health returns 200 in staging",
      "- [ ] docs updated" — the number (#001, #002, …, zero-padded to 3 digits) is
      added by the tool.
      States: `[ ]` todo, `[x]` done (one closed state, no emoji). Manage with
      `proj item add T-xxxxxx "<text>"`, `proj item check T-xxxxxx#001 --note …`,
      `proj item set T-xxxxxx#001 done`; sub-criteria via `--under 1`, optional
      `--owner` / `--due`. Each must be checkable by someone else without
      asking you; tick (check) only after verifying it — `proj task done` is
      refused while any criterion is still todo.
  - name: Steps
    hint: >-
      A loose description of how this task gets done — rough approach, key
      actions, gotchas. Free text, no checkboxes: the verifiable definition of
      done lives in Acceptance Criteria. Work that needs its own status, owner
      or a line in the task list belongs in a sub-task instead
      (proj task new ... --parent T-xxxxxx).
  - name: Open
    hint: >-
      Unresolved questions, blockers and decisions needed — one per line,
      plain text (no checkboxes), each naming who/what can unblock it, e.g.
      "Need DB credentials for staging (ask ops)". These lines are shown in the
      parent's task tree and TASKLIST.md, so keep them short. Delete a line
      once resolved and record the answer in Notes.
  - name: Notes
    hint: >-
      Working log and results: what was tried, what worked or failed and why,
      commands/configs used, measurements, links to commits/PRs, answers to
      former Open items. If the task is marked Failed, write the reason and
      any salvageable findings here.

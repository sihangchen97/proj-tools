name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: pixi-distribution/setup-pixi@v0.9.2
        with:
          manifest-file: pyproject.toml
          cache: true
      - name: Lint
        run: pixi run lint
      - name: Unit tests
        run: pixi run test
      - name: E2E smoke (full CLI lifecycle)
        run: pixi run e2e

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        run: pip install build && python -m build --wheel
      - name: Install into clean venv + smoke
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/proj-*.whl
          # CLI runs; MCP entry-point module imports (don't start the stdio server)
          /tmp/clean/bin/proj --help
          /tmp/clean/bin/python -c "import proj.mcp; print('proj.mcp OK')"
          # bundled profiles must be inside the wheel (profiles force-include)
          /tmp/clean/bin/python -c "from proj.core.templates import bundled_dir; d=bundled_dir(); assert (d/'default'/'task.yaml').exists(), d; print('profiles OK:', d)"
      - name: Verify metadata
        run: pip install -q twine && twine check dist/*.whl

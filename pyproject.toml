[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI name: 'proj' is already taken there (an unrelated pkg); the import name
# stays `proj` (packages = ["src/proj"]) and the CLIs stay `proj` / `proj-mcp`.
name = "proj-tools"
version = "0.1.0"
description = "Project governance tool: ADRs, tasklists, changelogs, tech debt, incidents, experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "mcp>=2",
]

[project.scripts]
proj = "proj.cli:app"
proj-mcp = "proj.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proj"]
# bundled profiles + scaffold templates live in the repo root — copy them
# into the wheel as proj/profiles and proj/templates
force-include = { "profiles" = "proj/profiles", "templates" = "proj/templates" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PLW"]

[tool.ruff.lint.per-file-ignores]
# docs.py holds the Chinese reference-doc prose (fullwidth punctuation is intentional)
"src/proj/docs.py" = ["RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- pixi (local dev & testing) -----------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
proj-tools = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.pixi.feature.dev.pypi-dependencies]
build = "*"

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.tasks]
test = { cmd = "pytest -q", default-environment = "dev" }
lint = { cmd = "ruff check src tests", default-environment = "dev" }
# e2e 情境（PCB 缺陷检测模型 v1）：在本地临时目录里跑，结束后拷回 .testproj/ 供浏览
e2e = { cmd = "python scripts/e2e.py", default-environment = "dev" }
# 同一套情境，每条命令启动真实的 proj 子进程（覆盖真实入口，较慢）
e2e-full = { cmd = "python scripts/e2e.py", env = { PROJ_E2E_SUBPROCESS = "1" }, default-environment = "dev" }
